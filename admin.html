<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN DASHBOARD // IMACHUI_NULLSECTOR</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --neon: #00ffd5; --red: #ff2b4e; --bg: #02060a; --panel: rgba(5,15,20,.9); --yellow: #ffea00; }
  body { background: var(--bg); color: #c8fff5; font-family: 'Share Tech Mono', monospace; padding: 20px; min-height: 100vh; overflow-x: hidden; }

  /* Matrix Rain sa background ng dashboard */
  #adminMatrixCanvas { position: fixed; inset: 0; z-index: 0; opacity: 0.15; pointer-events: none; }
  #adminElectricCanvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  .container { max-width: 1100px; margin: 0 auto; position: relative; z-index: 2; }

  h1 { font-family: 'Orbitron', sans-serif; color: var(--neon); text-align: center; margin-bottom: 30px; letter-spacing: 5px; text-shadow: 0 0 15px var(--neon), 0 0 30px var(--neon); animation: titlePulse 2s ease-in-out infinite alternate; }
  @keyframes titlePulse { 0% { filter: brightness(1); } 100% { filter: brightness(1.4); } }

  .section { background: var(--panel); border: 1px solid var(--neon); border-radius: 8px; padding: 20px; margin-bottom: 30px; box-shadow: 0 0 20px rgba(0,255,213,.25), inset 0 0 40px rgba(0,255,213,.05); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: sectionGlow 3s ease-in-out infinite alternate; }
  @keyframes sectionGlow { 0% { box-shadow: 0 0 20px rgba(0,255,213,.25); } 100% { box-shadow: 0 0 40px rgba(0,255,213,.5), inset 0 0 40px rgba(0,255,213,.08); } }

  .section h2 { color: var(--neon); font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid rgba(0,255,213,.3); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

  .clear-all-btn { background: transparent; border: 1px solid var(--red); color: var(--red); font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; padding: 5px 12px; border-radius: 4px; cursor: pointer; transition: all 0.3s; }
  .clear-all-btn:hover { background: var(--red); color: #000; box-shadow: 0 0 15px var(--red); }

  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid rgba(0,255,213,.1); }
  th { color: var(--neon); font-weight: bold; }
  tr:hover { background: rgba(0,255,213,.08); transition: background .2s; }

  .btn { display: inline-block; padding: 12px 20px; background: transparent; border: 2px solid var(--red); color: var(--red); text-decoration: none; font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 2px; cursor: pointer; transition: all .25s; border-radius: 6px; font-size: 0.8rem; text-align: center; }
  .btn:hover { background: var(--red); color: #000; box-shadow: 0 0 30px var(--red); }
  .btn-back { border-color: var(--neon); color: var(--neon); }
  .btn-back:hover { background: var(--neon); color: #001410; box-shadow: 0 0 30px var(--neon); }
  .btn-logout { border-color: var(--yellow); color: var(--yellow); }
  .btn-logout:hover { background: var(--yellow); color: #000; box-shadow: 0 0 30px var(--yellow); }
  .btn-phcorner { border-color: #ff2b4e; color: #ff2b4e; }
  .btn-phcorner:hover { background: #ff2b4e; color: #000; box-shadow: 0 0 30px #ff2b4e; }
  .btn-del { background: transparent; border: 1px solid var(--red); color: var(--red); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; font-family: 'Share Tech Mono', monospace; transition: all 0.2s; }
  .btn-del:hover { background: var(--red); color: #fff; box-shadow: 0 0 12px var(--red); }

  .controls { text-align: center; margin-top: 30px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }

  #passwordPrompt { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  #passwordPrompt input { padding: 15px; font-size: 1.2rem; background: #000; border: 2px solid var(--red); color: #fff; text-align: center; letter-spacing: 3px; margin-bottom: 20px; width: 300px; border-radius: 6px; outline: none; }
  #passwordPrompt input:focus { box-shadow: 0 0 20px var(--red); animation: inputShake .5s infinite; }
  @keyframes inputShake {
    0% { transform: translate(0,0); }
    15% { transform: translate(-2px,1px); }
    30% { transform: translate(2px,-1px); }
    45% { transform: translate(-1px,2px); }
    60% { transform: translate(1px,-2px); }
    75% { transform: translate(-2px,1px); }
    100% { transform: translate(0,0); }
  }
  .error { color: var(--red); margin-top: 10px; }
  .loading { text-align: center; color: #666; }

  @media (max-width: 600px) {
    body { padding: 12px; }
    h1 { font-size: 1.4rem; letter-spacing: 3px; }
    .section { padding: 15px; }
    .section h2 { font-size: 1rem; }
    table { font-size: 0.72rem; }
    th, td { padding: 7px; }
    .btn { padding: 10px 14px; font-size: 0.7rem; }
  }
</style>
</head>
<body>

<canvas id="adminMatrixCanvas"></canvas>
<canvas id="adminElectricCanvas"></canvas>

<div id="passwordPrompt">
  <h1 style="color: var(--red); text-shadow: 0 0 15px var(--red);">RESTRICTED AREA</h1>
  <p style="margin-bottom: 20px; color: #888;">Enter Darkweb Password:</p>
  <input type="password" id="adminPass" placeholder="••••••••" autocomplete="off">
  <button class="btn" id="unlockBtn" style="border-color: var(--neon); color: var(--neon);">UNLOCK</button>
  <div class="error" id="errorMsg"></div>
</div>

<div class="container" id="dashboardContent" style="display:none;">
  <h1>ADMIN DASHBOARD</h1>

  <div class="section">
    <h2>📋 Registered Users <button class="clear-all-btn" onclick="clearAllUsers()">CLEAR ALL</button></h2>
    <table id="usersTable">
      <thead><tr><th>Email</th><th>Date Registered</th><th>Action</th></tr></thead>
      <tbody><tr><td colspan="3" class="loading">Loading users...</td></tr></tbody>
    </table>
  </div>

  <div class="section">
    <h2>🕵️ Login Attempts <button class="clear-all-btn" onclick="clearAllAttempts()">CLEAR ALL</button></h2>
    <table id="attemptsTable">
      <thead><tr><th>Email</th><th>Type</th><th>Timestamp</th><th>Device</th><th>Action</th></tr></thead>
      <tbody><tr><td colspan="5" class="loading">Loading attempts...</td></tr></tbody>
    </table>
  </div>

  <div class="controls">
    <a href="https://phcorner.org/login/" target="_blank" class="btn btn-phcorner">GO TO PHCORNER</a>
    <a href="index.html" class="btn btn-back">← BACK TO SITE</a>
    <button class="btn btn-logout" id="logoutBtn">LOG OUT</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* ==========================================================
     MATRIX RAIN SA DASHBOARD (Full Animation sa mobile at PC)
     ========================================================== */
  const mCanvas = document.getElementById('adminMatrixCanvas');
  const mCtx = mCanvas.getContext('2d');
  const M_CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789IMACHUI_NULLSECTOR<>/\\{}[]#$%&';
  let mDrops = [];
  function resizeM() {
    mCanvas.width = window.innerWidth;
    mCanvas.height = window.innerHeight;
    const density = 16;
    const cols = Math.floor(mCanvas.width / density);
    mDrops = new Array(cols).fill(1);
  }
  function drawM() {
    mCtx.fillStyle = 'rgba(2,6,10,0.09)';
    mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
    mCtx.fillStyle = '#00ffd5';
    mCtx.font = '16px "Share Tech Mono", monospace';
    for (let i = 0; i < mDrops.length; i++) {
      const t = M_CHARS[(Math.random() * M_CHARS.length) | 0];
      mCtx.fillText(t, i * 16, mDrops[i] * 16);
      if (mDrops[i] * 16 > mCanvas.height && Math.random() > 0.975) mDrops[i] = 0;
      mDrops[i]++;
    }
  }

  /* ==========================================================
     ELECTRIC CANVAS SA DASHBOARD
     ========================================================== */
  const eCanvas = document.getElementById('adminElectricCanvas');
  const eCtx = eCanvas.getContext('2d');
  let eSparks = [], eLightnings = [], eSparkTimer = 0, eLightningTimer = 0;
  function resizeE() {
    eCanvas.width = window.innerWidth;
    eCanvas.height = window.innerHeight;
  }
  function spawnESpark(x, y) {
    if (eSparks.length >= 150) return;
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 3;
    eSparks.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, decay: 0.02 + Math.random()*0.03, size: 1 + Math.random()*2 });
  }
  function spawnELightning() {
    const sx = Math.random() * eCanvas.width;
    const ex = sx + (Math.random() - 0.5) * 400;
    const segs = [];
    for (let i = 0; i <= 14; i++) {
      const t = i / 14;
      segs.push({ x: sx + (ex-sx)*t + (Math.random()-0.5)*60, y: t * eCanvas.height });
    }
    eLightnings.push({ segs, life: 1, decay: 0.06 });
    if (eLightnings.length > 5) eLightnings.shift();
  }
  function updateE(dt) {
    eCtx.clearRect(0, 0, eCanvas.width, eCanvas.height);
    eSparkTimer += dt;
    if (eSparkTimer > 100) {
      eSparkTimer = 0;
      const side = (Math.random() * 4) | 0;
      let x, y;
      if (side === 0) { x = Math.random()*eCanvas.width; y = 0; }
      else if (side === 1) { x = eCanvas.width; y = Math.random()*eCanvas.height; }
      else if (side === 2) { x = Math.random()*eCanvas.width; y = eCanvas.height; }
      else { x = 0; y = Math.random()*eCanvas.height; }
      spawnESpark(x, y);
    }
    eLightningTimer += dt;
    if (eLightningTimer > 800) {
      eLightningTimer = 0;
      if (Math.random() > 0.5) spawnELightning();
    }
    for (let i = eSparks.length - 1; i >= 0; i--) {
      const s = eSparks[i];
      s.x += s.vx; s.y += s.vy;
      s.vx *= 0.98; s.vy *= 0.98; s.life -= s.decay;
      if (s.life <= 0) { eSparks.splice(i, 1); continue; }
      eCtx.beginPath();
      eCtx.arc(s.x, s.y, s.size*s.life, 0, Math.PI*2);
      eCtx.fillStyle = 'rgba(0,255,213,'+s.life+')';
      eCtx.shadowBlur = 15*s.life;
      eCtx.shadowColor = '#00ffd5';
      eCtx.fill();
    }
    for (let i = eLightnings.length - 1; i >= 0; i--) {
      const l = eLightnings[i];
      l.life -= l.decay;
      if (l.life <= 0) { eLightnings.splice(i, 1); continue; }
      eCtx.beginPath();
      eCtx.moveTo(l.segs[0].x, l.segs[0].y);
      for (let j = 1; j < l.segs.length; j++) eCtx.lineTo(l.segs[j].x, l.segs[j].y);
      eCtx.strokeStyle = 'rgba(0,255,213,'+l.life+')';
      eCtx.lineWidth = 2;
      eCtx.shadowBlur = 25;
      eCtx.shadowColor = '#00ffd5';
      eCtx.stroke();
    }
  }

  /* ==========================================================
     UNIFIED 120FPS LOOP
     ========================================================== */
  let lastT = 0;
  let mAcc = 0;
  function loop(t) {
    const dt = Math.min(t - lastT || 16, 50);
    lastT = t;
    mAcc += dt;
    if (mAcc >= 55) { mAcc = 0; drawM(); }
    updateE(dt);
    requestAnimationFrame(loop);
  }
  window.addEventListener('resize', () => { resizeM(); resizeE(); });
  resizeM(); resizeE();
  requestAnimationFrame(loop);

  /* ==========================================================
     SUPABASE
     ========================================================== */
  const SUPABASE_URL = 'https://mcpcjjvcykmmxlazcsbz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_coh6tjtEXrvWwXnZKBsubA_K-OrJX9F';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      storage: window.sessionStorage,
      storageKey: 'imachui-auth-session',
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: false
    }
  });
  const ADMIN_PASSWORD = 'Imachuinerts';

  document.getElementById('unlockBtn').addEventListener('click', async () => {
    const pass = document.getElementById('adminPass').value;
    if (pass === ADMIN_PASSWORD) {
      document.getElementById('passwordPrompt').style.display = 'none';
      document.getElementById('dashboardContent').style.display = 'block';
      await loadDashboardData();
    } else {
      document.getElementById('errorMsg').textContent = '❌ Incorrect password.';
    }
  });

  document.getElementById('adminPass').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('unlockBtn').click();
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  });

  window.deleteUser = async function(id) {
    if (!confirm('Are you sure you want to delete this user?')) return;
    const { error } = await supabaseClient.from('profiles').delete().eq('id', id);
    if (error) { alert('❌ Error deleting user: ' + error.message); }
    else { await loadDashboardData(); }
  };

  window.deleteAttempt = async function(id) {
    if (!confirm('Delete this login attempt?')) return;
    const { error } = await supabaseClient.from('login_attempts').delete().eq('id', id);
    if (error) { alert('❌ Error deleting attempt: ' + error.message); }
    else { await loadDashboardData(); }
  };

  window.clearAllUsers = async function() {
    if (!confirm('⚠️ WARNING: This will delete ALL registered users. Continue?')) return;
    const { error } = await supabaseClient.from('profiles').delete().neq('id', '00000000-0000-0000-0000-000000000000');
    if (error) { alert('❌ Error clearing users: ' + error.message); }
    else { await loadDashboardData(); }
  };

  window.clearAllAttempts = async function() {
    if (!confirm('⚠️ WARNING: This will delete ALL login attempts. Continue?')) return;
    const { error } = await supabaseClient.from('login_attempts').delete().neq('id', '00000000-0000-0000-0000-000000000000');
    if (error) { alert('❌ Error clearing attempts: ' + error.message); }
    else { await loadDashboardData(); }
  };

  async function loadDashboardData() {
    const { data: users, error: userError } = await supabaseClient.from('profiles').select('*').order('created_at', { ascending: false });
    const usersBody = document.querySelector('#usersTable tbody');
    if (!userError && users && users.length > 0) {
      usersBody.innerHTML = users.map(u => `
        <tr>
          <td>${u.email}</td>
          <td>${new Date(u.created_at).toLocaleString()}</td>
          <td><button class="btn-del" onclick="deleteUser('${u.id}')">DEL</button></td>
        </tr>
      `).join('');
    } else { usersBody.innerHTML = '<tr><td colspan="3" class="loading">No users found.</td></tr>'; }

    const { data: attempts, error: attemptError } = await supabaseClient.from('login_attempts').select('*').order('timestamp', { ascending: false });
    const attemptsBody = document.querySelector('#attemptsTable tbody');
    if (!attemptError && attempts && attempts.length > 0) {
      attemptsBody.innerHTML = attempts.map(a => `
        <tr>
          <td>${a.email}</td>
          <td style="color:${a.attempt_type.includes('failed') ? '#ff2b4e' : '#00ffd5'}">${a.attempt_type}</td>
          <td>${new Date(a.timestamp).toLocaleString()}</td>
          <td style="font-size:0.7rem; color:#888;">${(a.device || 'Unknown').substring(0, 50)}...</td>
          <td><button class="btn-del" onclick="deleteAttempt('${a.id}')">DEL</button></td>
        </tr>
      `).join('');
    } else { attemptsBody.innerHTML = '<tr><td colspan="5" class="loading">No login attempts found.</td></tr>'; }
  }
</script>
</body>
</html>
